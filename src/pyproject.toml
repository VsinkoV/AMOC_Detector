[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "AMOC_Detector"
version = "0.1.0"
maintainers = [
  { name="Valeriy Sinko", email="v.sinko@lancaster.ac.uk"},
]
authors = [
  { name="Valeriy Sinko", email="v.sinko@lancaster.ac.uk"},
]
description = "An AMOC Binary Segmentation package, designed to benchmark parametric and non-parametric cost functions against one another"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: OS Independent",
]
dependencies = [
  "numpy",
  "scikit-learn"
]

[project.urls]
homepage = "https://github.com/Harry-Ell/cpd_online"

